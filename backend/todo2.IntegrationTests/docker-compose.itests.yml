services:
  itests:
    build:
      context: ..
      dockerfile: todo2.IntegrationTests/Dockerfile.integration-tests
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=itests;Username=postgres;Password=postgres
      ASPNETCORE_ENVIRONMENT: Test
      DOCKER_API_VERSION: "1.43"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../:/src
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /src
    command: ["dotnet", "test", "./todo2.IntegrationTests/todo2.IntegrationTests.csproj", "-c", "Release"]