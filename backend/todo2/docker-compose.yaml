services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "10.0"
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
    volumes:
      - ./appsettings.json:/app/appsettings.json:ro
      - ./appsettings.Development.json:/app/appsettings.Development.json:ro
