services:
  todo2-postgres:
    image: postgres:16
    container_name: todo2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - todo2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend/todo2
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "10.0"
    container_name: todo2-backend
    restart: unless-stopped
    depends_on:
      todo2-postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Host=todo2-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Groq__ApiKey: "${GROQ_API_KEY}"
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ../backend/todo2/appsettings.json:/app/appsettings.json:ro
      - ../backend/todo2/appsettings.Development.json:/app/appsettings.Development.json:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    container_name: todo2-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  todo2_postgres_data:
